apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sports-manager-api-hpa
  namespace: sports-platform
  labels:
    app.kubernetes.io/name: sports-manager-api
    app.kubernetes.io/part-of: sports-manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sports-manager-api
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
