apiVersion: apps/v1
kind: Deployment
metadata:
  name: sports-manager-api
  namespace: sports-platform
  labels:
    app.kubernetes.io/name: sports-manager-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: sports-manager
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sports-manager-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sports-manager-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: sports-manager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/example-org/sports-manager-platform:v3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: PROBE_MODE
              value: "api"
            - name: RUN_MIGRATIONS
              value: "false"
            - name: RUN_BOT
              value: "false"
            - name: RUN_SCHEDULER
              value: "false"
            - name: RUN_CONSUMER
              value: "false"
          envFrom:
            - secretRef:
                name: sports-manager-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp-dir
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sports-manager-worker
  namespace: sports-platform
  labels:
    app.kubernetes.io/name: sports-manager-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: sports-manager
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sports-manager-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sports-manager-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: sports-manager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/example-org/sports-manager-platform:v3.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: "production"
            - name: PROBE_MODE
              value: "worker"
            - name: RUN_MIGRATIONS
              value: "false"
            - name: RUN_BOT
              value: "true"
            - name: RUN_SCHEDULER
              value: "true"
            - name: RUN_CONSUMER
              value: "true"
          envFrom:
            - secretRef:
                name: sports-manager-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - python
                - scripts/container_probe.py
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - scripts/container_probe.py
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp-dir
          emptyDir:
            sizeLimit: 64Mi
