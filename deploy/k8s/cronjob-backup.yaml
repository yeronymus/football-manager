apiVersion: batch/v1
kind: CronJob
metadata:
  name: sports-manager-pg-backup
  namespace: sports-platform
  labels:
    app.kubernetes.io/name: sports-manager-backup
    app.kubernetes.io/part-of: sports-manager
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sports-manager-backup
            app.kubernetes.io/part-of: sports-manager
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: pg-backup
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  OUT="/backups/db_backup_${TS}.dump"
                  pg_dump -Fc -Z 6 --no-owner --no-acl -f "${OUT}"
                  sha256sum "${OUT}" > "${OUT}.sha256"
                  pg_restore --list "${OUT}" > /dev/null
                  find /backups -name "db_backup_*.dump*" -mtime +30 -delete
              envFrom:
                - secretRef:
                    name: sports-manager-pg-backup-secret
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: sports-manager-backups-pvc
