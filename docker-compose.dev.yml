# ==============================================================================
# Isolated Developer Workstation Sandbox (Windows / macOS / Linux)
# Usage:
#   1. Browser + Bot Polling mode:
#        docker compose -f docker-compose.dev.yml --env-file .env.dev up --build
#   2. With HTTPS Cloudflare Tunnel for live mobile Telegram Mini App testing:
#        docker compose -f docker-compose.dev.yml --env-file .env.dev --profile tunnel up --build
# ==============================================================================

name: football-manager-dev

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-sports_dev}
      TZ: UTC
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5433}:5432"
    volumes:
      - fm_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-sports_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-dev_redis_password}"
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6380}:6379"
    volumes:
      - fm_dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:${DEV_APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - APP_ENV=local_dev
      - PROBE_MODE=api
      - RUN_MIGRATIONS=False
      - RUN_SCHEDULER=False
      - RUN_CONSUMER=False
      - RUN_BOT=False
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

  worker:
    build: .
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python app/worker.py
    environment:
      - APP_ENV=local_dev
      - PROBE_MODE=worker
    volumes:
      - ./app:/app/app

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2024.11.0
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate --url http://app:8000

volumes:
  fm_dev_postgres_data:
  fm_dev_redis_data:
